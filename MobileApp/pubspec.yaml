name: mobile_app
description: Smart Driver Safety & Fleet Monitoring System
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.5

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Sensors
  sensors_plus: ^7.0.0

  # Permissions
  permission_handler: ^12.0.1

  # Camera
  camera: ^0.11.2

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0-beta.4

  # Maps
  flutter_map: ^8.2.1
  latlong2: ^0.9.1

  # Notifications
  #flutter_local_notifications: ^19.4.1

  # Connectivity
  connectivity_plus: ^7.0.0
  socket_io_client: ^2.0.3

  # Hardware Alerts
  vibration: ^2.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.6.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/